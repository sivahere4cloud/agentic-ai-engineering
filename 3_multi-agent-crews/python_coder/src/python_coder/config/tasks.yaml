coding_task:
  description: >
    Write Python code to solve this assignment: {assignment}
    Run the code and check the output is correct. If it fails or gives a wrong answer,
    fix it and run it again. Only finish once you have seen it run successfully.
  expected_output: >
    The final working Python code in a single code block, followed by the exact output
    it produced when you ran it, and one sentence on what the code does.
  agent: coder