[project]
name = "python_coder"
version = "0.1.0"
description = "python_coder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
python_coder = "python_coder.main:run"
run_crew = "python_coder.main:run"
train = "python_coder.main:train"
replay = "python_coder.main:replay"
test = "python_coder.main:test"
run_with_trigger = "python_coder.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
