[project]
name = "uk_financial_researcher"
version = "0.1.0"
description = "uk_financial_researcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
uk_financial_researcher = "uk_financial_researcher.main:run"
run_crew = "uk_financial_researcher.main:run"
train = "uk_financial_researcher.main:train"
replay = "uk_financial_researcher.main:replay"
test = "uk_financial_researcher.main:test"
run_with_trigger = "uk_financial_researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
