[project]
name = "uk_company_shortlist"
version = "0.1.0"
description = "uk_company_shortlist using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
uk_company_shortlist = "uk_company_shortlist.main:run"
run_crew = "uk_company_shortlist.main:run"
train = "uk_company_shortlist.main:train"
replay = "uk_company_shortlist.main:replay"
test = "uk_company_shortlist.main:test"
run_with_trigger = "uk_company_shortlist.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
