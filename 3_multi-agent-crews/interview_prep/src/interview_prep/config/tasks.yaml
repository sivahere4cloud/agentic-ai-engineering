research_task:
  description: >
    Research {company} for a candidate applying for a {role} position.
    Find what the company does, its main products or services, its technology,
    recent news and anything relevant to a {role}.
    Focus on information that is current as of {current_year}.
    If something cannot be confirmed, say that it could not be confirmed.
  expected_output: >
    A list of 10 bullet points with the most relevant verified facts about {company},
    each one short and specific. Mark anything uncertain as unconfirmed.
  agent: researcher

reporting_task:
  description: >
    Using the research you were given, write an interview briefing for a {role} interview at {company}.
    Use only facts from the research. Do not add anything that was not found.
  expected_output: >
    A one-page briefing in markdown, with these sections:
    Company overview, Why this role matters here, Five likely interview questions,
    and Three smart questions to ask the interviewer.
    Formatted as markdown without '```'
  agent: reporting_analyst